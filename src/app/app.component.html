<app-header (openAuth)="onOpenAuth()"></app-header>

<main class="min-h-screen bg-slate-50">
    <router-outlet></router-outlet>
</main>

@if (showLoginModal) {
<app-login-modal (close)="onCloseLogin()" (switchToRegister)="onSwitchToRegister()"></app-login-modal>
}
@if (showRegisterModal) {
<app-register-modal (close)="onCloseRegister()" (switchToLogin)="onSwitchToLogin()"></app-register-modal>
}

<app-notification></app-notification>
